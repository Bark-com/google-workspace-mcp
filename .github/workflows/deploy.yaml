name: deploy
run-name: ${{ inputs.environment || 'platform' }} build ${{ inputs.image_tag }} (${{ github.ref_name }} by @${{ github.actor }})

# Build-only: pushes the sidecar image to ECR. It does NOT deploy. Rollout is a
# reviewed Bark-com/helm-charts PR that sets mcpSidecar.image.tag (see BARK.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: 'Environment whose AWS account receives the image'
        required: true
      image_tag:
        type: string
        description: 'Image tag, <upstream-version>-bark.<n> (e.g. v2.6.0-bark.1)'
        required: true

# Permission can be added at job level or workflow level
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: write    # This is required for actions/checkout
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'platform' }}
    # One build per destination tag at a time, queued (never cancelled), so a
    # second run for the same tag waits and then fails the "tag exists" guard
    # instead of racing it from another branch.
    concurrency:
      group: ${{ github.workflow }}-${{ inputs.environment || 'platform' }}-${{ inputs.image_tag }}
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        ref: ${{ github.event.inputs.branch || github.ref_name }}

    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v1.7.0
      with:
        role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ex-iam-github-oidc-${{ vars.ENVIRONMENT || 'platform' }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ vars.AWS_REGION }}
      if: github.event_name != 'pull_request'

    - name: get app repository name
      run: echo "REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV
      if: github.event_name != 'pull_request'

    - name: get github run number
      run: echo "RUN_NUMBER=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
      if: github.event_name != 'pull_request'

    - name: validate image tag
      env:
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-bark\.[0-9]+$ ]]; then
          echo "::error::image_tag '$IMAGE_TAG' must look like v2.6.0-bark.1"
          exit 1
        fi
        echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
      if: github.event_name != 'pull_request'

    - name: Login to GHCR Docker
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: refuse to overwrite an existing tag
      env:
        APP_NAME: ${{ env.REPOSITORY_NAME }}
      run: |
        # The ECR repository is tag-MUTABLE; never replace an image already in use.
        # Fail closed: only ImageNotFoundException means the tag is free.
        if out=$(aws ecr describe-images --repository-name "$APP_NAME" \
            --image-ids imageTag="$IMAGE_TAG" 2>&1); then
          echo "::error::$APP_NAME:$IMAGE_TAG already exists in ECR; bump the -bark.<n> suffix"
          exit 1
        fi
        if ! grep -q ImageNotFoundException <<<"$out"; then
          echo "::error::could not check ECR for $IMAGE_TAG: $out"
          exit 1
        fi
      if: github.event_name != 'pull_request'

    - name: Build, tag, and push app image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        APP_NAME: ${{ env.REPOSITORY_NAME }}
        DOCKER_BUILDKIT: 1
      run: |
        docker build . \
          --tag $ECR_REGISTRY/$APP_NAME:$IMAGE_TAG \
          --label org.opencontainers.image.revision=$(git rev-parse HEAD) \
          --label org.opencontainers.image.source=$(git config --get remote.origin.url)

        docker push \
          $ECR_REGISTRY/$APP_NAME:$IMAGE_TAG

        echo "Pushed $ECR_REGISTRY/$APP_NAME:$IMAGE_TAG from $(git rev-parse HEAD)" >> $GITHUB_STEP_SUMMARY

      if: github.event_name != 'pull_request'
